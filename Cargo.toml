[package]
name = "ayeaye-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ayeaye"
path = "src/main.rs"

[dependencies]

gpui-kit = "0.8.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "6"
iana-time-zone = "0.1"
log = "0.4"
env_logger = "0.11"
# Only to switch on render-to-image for devtools; the app uses GPUI through gpui-kit.
gpui-pre = { version = "=0.3.9", features = ["test-support"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
htmd = "0.5.6"
futures = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[features]
# Scripted screenshots and input, for development: see src/devtools.rs.
devtools = ["dep:gpui-pre", "dep:gpui-pre-macos", "dep:image"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = { version = "=0.3.9", features = ["test-support"], optional = true }
